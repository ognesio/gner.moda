[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prévia correta de links (WhatsApp, Instagram…) para peças e projetos
[[edge_functions]]
  function = "og"
  path = "/acervo/*"

[[edge_functions]]
  function = "og"
  path = "/projetos/*"

# Site de página única: toda rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# /static/* usa o cache padrão do Netlify (o navegador confere se a foto mudou),
# para que trocar uma imagem com o mesmo nome apareça na hora.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
